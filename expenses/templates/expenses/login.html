{% extends 'expenses/base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">ورود</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">ورود</button>
                    </div>
                </form>
                <hr>
                <p class="text-center mb-0">حساب نداری؟ <a href="{% url 'signup' %}">اینجا ثبت‌نام کن</a></p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
