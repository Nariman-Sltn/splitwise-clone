{% extends 'expenses/base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="d-flex align-items-center gap-2 mb-4">
            <h5 class="fw-bold mb-0">ساخت گروه جدید</h5>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-success">➕ بساز</button>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">← بازگشت</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
