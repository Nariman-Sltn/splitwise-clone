<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Splitwise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        * {cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMicgaGVpZ2h0PSczMic+CiAgPGNpcmNsZSBjeD0nMTYnIGN5PScxNicgcj0nMTQnIGZpbGw9JyNGRkQ3MDAnIHN0cm9rZT0nI0I4ODYwQicgc3Ryb2tlLXdpZHRoPScyJy8+CiAgPHRleHQgeD0nMTYnIHk9JzIxJyBmb250LXNpemU9JzE0JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmaWxsPScjQjg4NjBCJyBmb250LXdlaWdodD0nYm9sZCc+JiMzNjs8L3RleHQ+Cjwvc3ZnPg==") 16 16, auto;}
    cursor: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMicgaGVpZ2h0PSczMic+CiAgPGNpcmNsZSBjeD0nMTYnIGN5PScxNicgcj0nMTQnIGZpbGw9JyNGRkQ3MDAnIHN0cm9rZT0nI0I4ODYwQicgc3Ryb2tlLXdpZHRoPScyJy8+CiAgPHRleHQgeD0nMTYnIHk9JzIxJyBmb250LXNpemU9JzE0JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmaWxsPScjQjg4NjBCJyBmb250LXdlaWdodD0nYm9sZCc+JiMzNjs8L3RleHQ+Cjwvc3ZnPg==") 16 16, pointer !important;
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; font-size: 1.3rem; letter-spacing: 1px; }
        .card { border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; }
        .btn { border-radius: 8px; }
        .badge { font-size: 0.8rem; }
    </style>
</head>

<script>
    const coinCursor = "url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMicgaGVpZ2h0PSczMic+CiAgPGNpcmNsZSBjeD0nMTYnIGN5PScxNicgcj0nMTQnIGZpbGw9JyNGRkQ3MDAnIHN0cm9rZT0nI0I4ODYwQicgc3Ryb2tlLXdpZHRoPScyJy8+CiAgPHRleHQgeD0nMTYnIHk9JzIxJyBmb250LXNpemU9JzE0JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmaWxsPScjQjg4NjBCJyBmb250LXdlaWdodD0nYm9sZCc+JiMzNjs8L3RleHQ+Cjwvc3ZnPg==') 16 16, auto";
    document.addEventListener('mouseover', function(e) {
        e.target.style.setProperty('cursor', coinCursor, 'important');
    });
</script>

<body>
    <style>
        body {
            background-color: #e1e2e3;
            background-image: repeating-linear-gradient(
                45deg,
                #e8f5e9 0px,
                #e8f5e9 2px,
                transparent 2px,
                transparent 12px
            );
        }
    </style>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">💰 Splitwise</a>
            <div class="d-flex gap-2 align-items-center">
                {% if user.is_authenticated %}
                <span class="navbar-text text-white opacity-75 small">سلام، {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">خروج</button>
                </form>
                <a href="{% url 'delete_account' %}" class="btn btn-danger btn-sm">حذف حساب</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">ورود</a>
                    <a href="{% url 'signup' %}" class="btn btn-light btn-sm text-success fw-bold">ثبت‌نام</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger rounded-3 shadow-sm">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
